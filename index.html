<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriMed | صاحب المحل</title>
<style>
:root{--green:#087653;--dark:#123c32;--mint:#e8f5ef;--bg:#f4f8f6;--line:#dce9e2;--text:#203a32;--muted:#6d8179;--gold:#f2b84b;--red:#c84b45}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--dark);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-size:25px;font-weight:800;padding:8px 12px 22px;color:#d5f5e5}.brand small{display:block;font-size:12px;color:#9fc9b6;font-weight:400;margin-top:6px}.nav{border:0;text-align:right;padding:13px 14px;border-radius:10px;color:#dcebe4;background:transparent}.nav:hover,.nav.active{background:#23634f;color:#fff}.sidebar .foot{margin-top:auto;color:#a5c7b7;font-size:12px;padding:10px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}.topbar h1{font-size:22px;margin:0}.profile{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:bold}.content{padding:25px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.welcome h2{margin:0 0 8px;font-size:24px}.muted{color:var(--muted);font-size:14px}.btn{border:0;background:var(--green);color:white;border-radius:10px;padding:11px 16px;font-weight:700}.btn.secondary{background:#e3f2eb;color:var(--green)}.btn.danger{background:#fff0ef;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px}.stat .label{color:var(--muted);font-size:14px}.stat strong{display:block;font-size:28px;margin:12px 0 4px;color:var(--dark)}.stat small{color:var(--muted)}.panel{margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel h3{margin:0;font-size:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 12px;min-width:0;color:var(--text)}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:right;padding:13px 10px;border-bottom:1px solid #edf2ef;font-size:14px;white-space:nowrap}th{color:var(--muted);font-weight:600;background:#f9fbfa}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#e6f6ed;color:#087653;font-size:12px}.pill.warn{background:#fff4dc;color:#9a6a08}.pill.low{background:#ffebe9;color:#b33b35}.actions{display:flex;gap:6px}.smallbtn{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 9px;color:var(--green)}.empty{padding:30px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:var(--muted)}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}.form-actions{display:flex;gap:9px;margin-top:18px}.notice{padding:12px 14px;background:#fff7e4;color:#7a5a15;border-radius:10px;margin-bottom:15px;font-size:14px}.hidden{display:none!important}.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#f7fbf9;border-radius:12px;padding:15px;text-align:right;color:var(--green)}.quick b{display:block;margin-bottom:5px}.modalback{position:fixed;inset:0;background:#122c2480;display:grid;place-items:center;padding:15px;z-index:5}.modal{background:white;width:min(800px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#eef4f0;border-radius:8px;padding:7px 11px}.toast{position:fixed;bottom:20px;left:20px;background:var(--dark);color:white;padding:12px 18px;border-radius:10px;z-index:10;box-shadow:0 5px 20px #0002}.mobile-menu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;inset:0 auto 0 0;width:260px;z-index:8;box-shadow:0 0 0 999px #0006}.mobile-menu{display:inline-block}.topbar{padding:0 15px}.content{padding:15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.welcome{align-items:flex-start;flex-direction:column}.topbar h1{font-size:18px}}
@media(max-width:520px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.topbar{height:66px}}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">🌿 AgriMed<small>إدارة محل الأدوية والمستلزمات</small></div>
<button class="nav active" data-page="dashboard">▦　لوحة التحكم</button><button class="nav" data-page="products">▤　المنتجات والمخزون</button><button class="nav" data-page="locations">⌖　مواقع التخزين</button><button class="nav" data-page="farmers">♙　الفلاحون</button><button class="nav" data-page="orders">▣　الطلبات</button><button class="nav" data-page="sales">د.ج　المبيعات والفواتير</button><button class="nav" data-page="activity">◷　سجل العمليات</button><div class="foot">نموذج تجريبي محلي<br>البيانات محفوظة في هذا المتصفح فقط</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn secondary mobile-menu" id="menuBtn">☰</button><h1 id="pageTitle">لوحة التحكم</h1></div><div class="profile"><div class="avatar">م</div><div><b>صاحب المحل</b><br><span>حساب تجريبي</span></div></div></header><div class="content" id="content"></div></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='agrimed_shop_demo_v1';
const seed={products:[
{id:'0001',name:'مثال: منتج زراعي A',active:'مادة فعالة تجريبية',concentration:'10%',type:'مبيد',qty:24,unit:'علبة',min:5,buy:700,sell:950,company:'شركة تجريبية',origin:'الجزائر',batch:'B-2026-01',expiry:'2027-06-30',floor:'15',shelf:'B',cabinet:'2',section:'مبيدات',image:'',notes:'بيانات توضيحية فقط'},
{id:'0002',name:'مثال: منتج زراعي B',active:'مادة فعالة تجريبية',concentration:'5%',type:'سماد',qty:4,unit:'كيس',min:8,buy:1200,sell:1500,company:'شركة تجريبية',origin:'الجزائر',batch:'B-2026-02',expiry:'2026-12-15',floor:'60',shelf:'A',cabinet:'1',section:'أسمدة',image:'',notes:'بيانات توضيحية فقط'},
{id:'0003',name:'مثال: منتج زراعي C',active:'مادة فعالة تجريبية',concentration:'20%',type:'مستلزم',qty:15,unit:'قطعة',min:3,buy:250,sell:400,company:'شركة تجريبية',origin:'الجزائر',batch:'B-2026-03',expiry:'2028-02-01',floor:'115',shelf:'C',cabinet:'3',section:'مستلزمات',image:'',notes:''}],farmers:[{id:'F001',name:'فلاح تجريبي',phone:'0550000000',area:'بلدية تجريبية',notes:'بيانات تجريبية'}],orders:[{id:'REQ-001',farmer:'فلاح تجريبي',product:'0001',qty:2,status:'جديد',date:new Date().toISOString().slice(0,10)}],sales:[],activity:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){db=JSON.parse(JSON.stringify(seed))}
let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function log(msg){db.activity.unshift({date:new Date().toLocaleString('ar-DZ'),msg});db.activity=db.activity.slice(0,150);save()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return Number(v||0).toLocaleString('fr-DZ')+' دج'}
function nextId(list,prefix=''){let n=list.reduce((m,x)=>Math.max(m,parseInt(String(x.id).replace(/\D/g,''))||0),0)+1;return prefix+String(n).padStart(4,'0')}
function productBy(id){return db.products.find(p=>p.id===id)}
function toast(msg){document.getElementById('toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2600)}
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');render()}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
const titles={dashboard:'لوحة التحكم',products:'المنتجات والمخزون',locations:'مواقع التخزين',farmers:'الفلاحون',orders:'الطلبات',sales:'المبيعات والفواتير',activity:'سجل العمليات'};
function render(){document.getElementById('pageTitle').textContent=titles[page];const c=document.getElementById('content');({dashboard:renderDashboard,products:renderProducts,locations:renderLocations,farmers:renderFarmers,orders:renderOrders,sales:renderSales,activity:renderActivity}[page]||renderDashboard)(c)}
function renderDashboard(c){let low=db.products.filter(p=>+p.qty<=+p.min).length;let today=db.sales.filter(s=>s.date===new Date().toISOString().slice(0,10)).reduce((a,s)=>a+s.total,0);c.innerHTML=`<div class="welcome"><div><h2>مرحبا بك في AgriMed 🌿</h2><div class="muted">إدارة محل الأدوية والمستلزمات الفلاحية — نموذج أولي مستقل</div></div><button class="btn" onclick="openProduct()">＋ إضافة منتج</button></div><div class="notice">هذا نموذج تجريبي ببيانات افتراضية. لا تستعمل أسماء المنتجات التجريبية كإرشادات علاجية حقيقية.</div><div class="stats"><div class="stat"><div class="label">عدد المنتجات</div><strong>${db.products.length}</strong><small>منتج مسجل</small></div><div class="stat"><div class="label">تنبيهات نقص المخزون</div><strong>${low}</strong><small>منتجات عند الحد الأدنى أو أقل</small></div><div class="stat"><div class="label">الطلبات المفتوحة</div><strong>${db.orders.filter(o=>!['تم التسليم','ملغى'].includes(o.status)).length}</strong><small>تحتاج متابعة</small></div><div class="stat"><div class="label">مبيعات اليوم</div><strong style="font-size:22px">${money(today)}</strong><small>من الفواتير التجريبية المسجلة</small></div></div><div class="two-col"><section class="panel"><div class="panel-head"><h3>منتجات تحتاج انتباه</h3><button class="smallbtn" onclick="go('products')">عرض الكل</button></div>${tableProducts(db.products.filter(p=>+p.qty<=+p.min).slice(0,5))}</section><section class="panel"><div class="panel-head"><h3>اختصارات سريعة</h3></div><div class="quick"><button onclick="openProduct()"><b>＋ إضافة منتج</b><span class="muted">تسجيل منتج جديد</span></button><button onclick="go('locations')"><b>⌖ البحث عن موقع</b><span class="muted">معرفة مكان التخزين</span></button><button onclick="go('orders')"><b>▣ مراجعة الطلبات</b><span class="muted">متابعة التحضير والتسليم</span></button></div></section></div>`}
function tableProducts(list){if(!list.length)return '<div class="empty">لا توجد منتجات في هذه القائمة.</div>';return `<div class="table-wrap"><table><thead><tr><th>رقم</th><th>اسم المنتج</th><th>الكمية</th><th>الموقع</th><th>الحالة</th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td>${p.qty} ${esc(p.unit)}</td><td>طابق ${esc(p.floor||'—')} / رف ${esc(p.shelf||'—')}</td><td><span class="pill ${+p.qty<=+p.min?'low':''}">${+p.qty<=+p.min?'مخزون منخفض':'متوفر'}</span></td></tr>`).join('')}</tbody></table></div>`}
function renderProducts(c){c.innerHTML=`<div class="welcome"><div><h2>المنتجات والمخزون</h2><div class="muted">أضف المنتجات وعدّل الكميات والأسعار ومعلومات الصلاحية.</div></div><button class="btn" onclick="openProduct()">＋ إضافة منتج</button></div><section class="panel"><div class="toolbar"><input id="prodSearch" placeholder="ابحث بالاسم أو الرقم أو المادة الفعالة أو الدفعة..."><select id="prodType"><option value="">كل الأنواع</option>${['مبيد','سماد','مستلزم','بذور','أخرى'].map(t=>`<option>${t}</option>`).join('')}</select></div><div id="productTable">${tableAllProducts(db.products)}</div></section>`;document.getElementById('prodSearch').oninput=filterProducts;document.getElementById('prodType').onchange=filterProducts}
function tableAllProducts(list){if(!list.length)return '<div class="empty">ماكان حتى منتج مطابق.</div>';return `<div class="table-wrap"><table><thead><tr><th>رقم المنتج</th><th>الاسم</th><th>المادة الفعالة</th><th>الكمية</th><th>سعر البيع</th><th>الصلاحية</th><th>الموقع</th><th>إجراءات</th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.id)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.active)}</td><td>${p.qty} ${esc(p.unit)} ${+p.qty<=+p.min?'<span class="pill low">منخفض</span>':''}</td><td>${money(p.sell)}</td><td>${esc(p.expiry||'—')}</td><td>طابق ${esc(p.floor||'—')} / رف ${esc(p.shelf||'—')} / خزانة ${esc(p.cabinet||'—')}</td><td><div class="actions"><button class="smallbtn" onclick="openProduct('${p.id}')">تعديل</button><button class="smallbtn" onclick="adjustStock('${p.id}')">تحديث كمية</button></div></td></tr>`).join('')}</tbody></table></div>`}
function filterProducts(){let q=document.getElementById('prodSearch').value.toLowerCase(),t=document.getElementById('prodType').value;document.getElementById('productTable').innerHTML=tableAllProducts(db.products.filter(p=>(!t||p.type===t)&&[p.id,p.name,p.active,p.batch,p.floor,p.shelf,p.cabinet].some(v=>String(v||'').toLowerCase().includes(q))))}
function openProduct(id=''){let p=id?productBy(id):{id:'',name:'',active:'',concentration:'',type:'مبيد',qty:0,unit:'علبة',min:5,buy:0,sell:0,company:'',origin:'',batch:'',expiry:'',floor:'',shelf:'',cabinet:'',section:'',notes:''};document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${id?'تعديل المنتج':'إضافة منتج جديد'}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="productForm"><div class="formgrid">${field('name','الاسم التجاري',p.name,true)}${field('active','المادة الفعالة',p.active)}${field('concentration','التركيز',p.concentration)}<div class="field"><label>النوع</label><select name="type">${['مبيد','سماد','مستلزم','بذور','أخرى'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></div>${field('qty','الكمية الحالية',p.qty,'number',true)}<div class="field"><label>وحدة القياس</label><select name="unit">${['علبة','قارورة','كيس','لتر','كيلوغرام','قطعة','غرام','ملليلتر'].map(t=>`<option ${p.unit===t?'selected':''}>${t}</option>`).join('')}</select></div>${field('min','الحد الأدنى للتنبيه',p.min,'number')}${field('buy','سعر الشراء (دج)',p.buy,'number')}${field('sell','سعر البيع (دج)',p.sell,'number')}${field('company','الشركة المصنعة',p.company)}${field('origin','بلد المنشأ',p.origin)}${field('batch','رقم الدفعة',p.batch)}${field('expiry','تاريخ انتهاء الصلاحية',p.expiry,'date')}${field('floor','رقم الطابق/الرف',p.floor)}${field('shelf','الرف',p.shelf)}${field('cabinet','الخزانة',p.cabinet)}${field('section','القسم',p.section)}<div class="field full"><label>ملاحظات</label><textarea name="notes" rows="2">${esc(p.notes||'')}</textarea></div></div><div class="form-actions"><button class="btn" type="submit">حفظ المنتج</button><button class="btn secondary" type="button" onclick="closeModal()">إلغاء</button></div></form></div></div>`;document.getElementById('productForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),obj=Object.fromEntries(fd.entries());['qty','min','buy','sell'].forEach(k=>obj[k]=Number(obj[k]||0));if(id){let old=productBy(id);Object.assign(old,obj);log('تعديل المنتج '+old.id+' — '+old.name)}else{obj.id=nextId(db.products);db.products.push(obj);log('إضافة منتج '+obj.id+' — '+obj.name)}save();closeModal();render();toast('تم حفظ المنتج في هذا المتصفح')};}
function field(n,label,val,type='text',required=false){if(type===true){required=true;type='text'}return `<div class="field"><label>${label}</label><input name="${n}" type="${type}" value="${esc(val??'')}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}></div>`}
function adjustStock(id){let p=productBy(id);document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:480px"><div class="modalhead"><h2>تحديث كمية: ${esc(p.name)}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="muted">الكمية الحالية: ${p.qty} ${esc(p.unit)}</div><form id="stockForm"><div class="field" style="margin-top:15px"><label>نوع الحركة</label><select name="mode"><option value="add">إضافة كمية مستلمة</option><option value="remove">صرف/بيع فعلي</option><option value="set">تصحيح الكمية إلى قيمة</option></select></div><div class="field" style="margin-top:12px"><label>الكمية أو القيمة</label><input name="amount" type="number" min="0" step="any" required></div><div class="field" style="margin-top:12px"><label>سبب التغيير</label><input name="reason" required placeholder="مثال: استلام فاتورة مورد"></div><div class="form-actions"><button class="btn">تأكيد التحديث</button></div></form></div></div>`;document.getElementById('stockForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),mode=f.get('mode'),n=Number(f.get('amount'));if(mode==='remove'&&n>Number(p.qty)){toast('الكمية المطلوبة أكبر من المخزون');return}let old=p.qty;if(mode==='add')p.qty=Number(p.qty)+n;else if(mode==='remove')p.qty=Number(p.qty)-n;else p.qty=n;log(`تحديث مخزون ${p.id}: ${old} ← ${p.qty} | ${f.get('reason')}`);save();closeModal();render();toast('تم تحديث المخزون') }}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function renderLocations(c){c.innerHTML=`<div class="welcome"><div><h2>البحث عن موقع التخزين</h2><div class="muted">اكتب اسم المنتج أو رقمه أو الطابق أو الرف.</div></div></div><section class="panel"><div class="toolbar"><input id="locSearch" placeholder="مثال: 0001 أو طابق 15 أو اسم المنتج"><button class="btn" onclick="filterLocations()">بحث</button></div><div id="locationResults">${locationResults(db.products)}</div></section>`;document.getElementById('locSearch').oninput=filterLocations}
function locationResults(list){if(!list.length)return '<div class="empty">لم يتم العثور على منتج.</div>';return `<div class="table-wrap"><table><thead><tr><th>المنتج</th><th>رقم المنتج</th><th>الطابق</th><th>الرف</th><th>الخزانة</th><th>القسم</th><th>الكمية</th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.id)}</td><td>${esc(p.floor||'غير محدد')}</td><td>${esc(p.shelf||'غير محدد')}</td><td>${esc(p.cabinet||'غير محدد')}</td><td>${esc(p.section||'غير محدد')}</td><td>${p.qty} ${esc(p.unit)}</td></tr>`).join('')}</tbody></table></div>`}
function filterLocations(){let q=document.getElementById('locSearch').value.toLowerCase();document.getElementById('locationResults').innerHTML=locationResults(db.products.filter(p=>[p.name,p.id,p.active,p.floor,p.shelf,p.cabinet,p.section].some(v=>String(v||'').toLowerCase().includes(q))))}
function renderFarmers(c){c.innerHTML=`<div class="welcome"><div><h2>الفلاحون</h2><div class="muted">إدارة قائمة الفلاحين وبيانات التواصل.</div></div><button class="btn" onclick="openFarmer()">＋ إضافة فلاح</button></div><section class="panel"><div class="toolbar"><input id="farmerSearch" placeholder="ابحث بالاسم أو رقم الهاتف أو رقم الفلاح"></div><div id="farmerTable">${farmerTable(db.farmers)}</div></section>`;document.getElementById('farmerSearch').oninput=e=>document.getElementById('farmerTable').innerHTML=farmerTable(db.farmers.filter(f=>[f.id,f.name,f.phone,f.area].some(v=>String(v||'').toLowerCase().includes(e.target.value.toLowerCase()))))}
function farmerTable(list){if(!list.length)return '<div class="empty">لا توجد سجلات فلاحين.</div>';return `<div class="table-wrap"><table><thead><tr><th>رقم الفلاح</th><th>الاسم</th><th>الهاتف</th><th>البلدية/المنطقة</th><th>ملاحظات</th></tr></thead><tbody>${list.map(f=>`<tr><td>${esc(f.id)}</td><td>${esc(f.name)}</td><td>${esc(f.phone)}</td><td>${esc(f.area)}</td><td>${esc(f.notes)}</td></tr>`).join('')}</tbody></table></div>`}
function openFarmer(){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:550px"><div class="modalhead"><h2>إضافة فلاح</h2><button class="close" onclick="closeModal()">✕</button></div><form id="farmerForm"><div class="formgrid">${field('name','اسم الفلاح','', 'text',true)}${field('phone','رقم الهاتف','','tel',true)}${field('area','البلدية/المنطقة','') }<div class="field full"><label>ملاحظات</label><textarea name="notes" rows="2"></textarea></div></div><div class="form-actions"><button class="btn">حفظ الفلاح</button></div></form></div></div>`;document.getElementById('farmerForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(db.farmers.some(x=>x.phone===f.phone)){toast('رقم الهاتف موجود في القائمة بالفعل');return}f.id='F'+String(db.farmers.length+1).padStart(3,'0');db.farmers.push(f);log('إضافة فلاح '+f.name);save();closeModal();render();toast('تم حفظ الفلاح')}}
function renderOrders(c){c.innerHTML=`<div class="welcome"><div><h2>الطلبات</h2><div class="muted">تغيير حالة الطلب بعد تنفيذ الخطوة فعليًا.</div></div><button class="btn" onclick="openOrder()">＋ تسجيل طلب</button></div><section class="panel"><div class="toolbar"><select id="orderFilter"><option value="">كل الحالات</option>${['جديد','قيد التحضير','جاهز للاستلام','تم التسليم','ملغى'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="orderTable">${orderTable(db.orders)}</div></section>`;document.getElementById('orderFilter').onchange=e=>document.getElementById('orderTable').innerHTML=orderTable(db.orders.filter(o=>!e.target.value||o.status===e.target.value))}
function orderTable(list){if(!list.length)return '<div class="empty">لا توجد طلبات.</div>';return `<div class="table-wrap"><table><thead><tr><th>رقم الطلب</th><th>الفلاح</th><th>المنتج</th><th>الكمية</th><th>التاريخ</th><th>الحالة</th><th>تحديث الحالة</th></tr></thead><tbody>${list.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.farmer)}</td><td>${esc(productBy(o.product)?.name||o.product)}</td><td>${o.qty}</td><td>${esc(o.date)}</td><td><span class="pill ${o.status==='ملغى'?'low':o.status==='جاهز للاستلام'?'warn':''}">${esc(o.status)}</span></td><td><select onchange="setOrderStatus('${o.id}',this.value)">${['جديد','قيد التحضير','جاهز للاستلام','تم التسليم','ملغى'].map(st=>`<option ${st===o.status?'selected':''}>${st}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`}
function openOrder(){if(!db.farmers.length||!db.products.length){toast('أضف فلاحًا ومنتجًا أولًا');return}document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:550px"><div class="modalhead"><h2>تسجيل طلب</h2><button class="close" onclick="closeModal()">✕</button></div><form id="orderForm"><div class="formgrid"><div class="field full"><label>الفلاح</label><select name="farmer">${db.farmers.map(f=>`<option>${esc(f.name)}</option>`).join('')}</select></div><div class="field full"><label>المنتج</label><select name="product">${db.products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} — متوفر ${p.qty} ${esc(p.unit)}</option>`).join('')}</select></div>${field('qty','الكمية المطلوبة',1,'number',true)}${field('date','تاريخ الطلب',new Date().toISOString().slice(0,10),'date',true)}</div><div class="form-actions"><button class="btn">حفظ الطلب</button></div></form></div></div>`;document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.qty=Number(o.qty);if(o.qty<=0){toast('أدخل كمية صحيحة');return}if(o.qty>Number(productBy(o.product).qty)){toast('تنبيه: الكمية المطلوبة أكبر من المخزون الحالي؛ الطلب يسجل للمراجعة ولا يتم الخصم');}o.id='REQ-'+String(db.orders.length+1).padStart(3,'0');o.status='جديد';db.orders.push(o);log('تسجيل طلب '+o.id+' — دون خصم تلقائي للمخزون');save();closeModal();render();toast('تم تسجيل الطلب دون خصم المخزون')}}
function setOrderStatus(id,status){let o=db.orders.find(x=>x.id===id);if(!o)return;if(status==='تم التسليم'&&o.status!=='تم التسليم'){let p=productBy(o.product);if(p&&Number(p.qty)<Number(o.qty)){toast('لا يمكن تأكيد التسليم: المخزون غير كافٍ');render();return}if(p){p.qty=Number(p.qty)-Number(o.qty);log('خصم '+o.qty+' من '+p.name+' عند تأكيد تسليم '+id)}}o.status=status;log('تغيير حالة الطلب '+id+' إلى '+status);save();render();toast('تم تحديث حالة الطلب')}
function renderSales(c){let total=db.sales.reduce((a,s)=>a+s.total,0);c.innerHTML=`<div class="welcome"><div><h2>المبيعات والفواتير</h2><div class="muted">تسجيل البيع وحساب المجموع وإنشاء فاتورة قابلة للطباعة.</div></div><button class="btn" onclick="openSale()">＋ تسجيل بيع</button></div><div class="stats"><div class="stat"><div class="label">عدد الفواتير</div><strong>${db.sales.length}</strong></div><div class="stat"><div class="label">إجمالي المبيعات المسجلة</div><strong style="font-size:22px">${money(total)}</strong></div></div><section class="panel"><div class="panel-head"><h3>الفواتير</h3><span class="muted">بيانات النموذج محفوظة محليًا</span></div>${salesTable()}</section>`}
function salesTable(){if(!db.sales.length)return '<div class="empty">لا توجد فواتير حتى الآن. اضغط «تسجيل بيع» لإنشاء أول فاتورة تجريبية.</div>';return `<div class="table-wrap"><table><thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>العميل</th><th>المنتج</th><th>الكمية</th><th>المجموع</th><th>إجراء</th></tr></thead><tbody>${db.sales.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.date)}</td><td>${esc(s.customer)}</td><td>${esc(productBy(s.product)?.name||s.product)}</td><td>${s.qty}</td><td>${money(s.total)}</td><td><button class="smallbtn" onclick="printInvoice('${s.id}')">طباعة</button></td></tr>`).join('')}</tbody></table></div>`}
function openSale(){if(!db.products.length){toast('أضف منتجًا أولًا');return}document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:550px"><div class="modalhead"><h2>تسجيل بيع</h2><button class="close" onclick="closeModal()">✕</button></div><form id="saleForm"><div class="formgrid"><div class="field full"><label>العميل (اختياري)</label><input name="customer" placeholder="اسم الزبون"></div><div class="field full"><label>المنتج</label><select name="product" id="saleProduct">${db.products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} — ${money(p.sell)} — المتوفر ${p.qty}</option>`).join('')}</select></div>${field('qty','الكمية',1,'number',true)}${field('date','التاريخ',new Date().toISOString().slice(0,10),'date',true)}</div><div class="form-actions"><button class="btn">تأكيد البيع وإنشاء فاتورة</button></div></form></div></div>`;document.getElementById('saleForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),p=productBy(f.product),qty=Number(f.qty);if(qty<=0||qty>Number(p.qty)){toast('الكمية غير صحيحة أو المخزون غير كافٍ');return}p.qty=Number(p.qty)-qty;let s={id:'INV-'+String(db.sales.length+1).padStart(4,'0'),customer:f.customer||'زبون مباشر',product:p.id,qty,date:f.date,total:qty*Number(p.sell)};db.sales.push(s);log('تسجيل بيع '+s.id+' للمنتج '+p.name+' والكمية '+qty);save();closeModal();render();toast('تم تسجيل البيع وإنشاء الفاتورة')}}
function printInvoice(id){let s=db.sales.find(x=>x.id===id),p=productBy(s.product);let w=window.open('','_blank');if(!w){toast('اسمح بفتح نافذة الطباعة من المتصفح');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="utf-8"><title>فاتورة ${esc(s.id)}</title><style>body{font-family:Arial,Tahoma;padding:35px;color:#183d31}h1{color:#087653}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{padding:12px;border:1px solid #ccc;text-align:right}.total{font-size:22px;font-weight:bold;margin-top:25px}</style><h1>AgriMed — فاتورة بيع</h1><p>رقم الفاتورة: ${esc(s.id)} | التاريخ: ${esc(s.date)}</p><p>العميل: ${esc(s.customer)}</p><table><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>المجموع</th></tr><tr><td>${esc(p?.name||s.product)}</td><td>${s.qty}</td><td>${money(p?.sell)}</td><td>${money(s.total)}</td></tr></table><div class="total">المجموع النهائي: ${money(s.total)}</div><p>فاتورة صادرة عن نموذج AgriMed التجريبي.</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}
function renderActivity(c){c.innerHTML=`<div class="welcome"><div><h2>سجل العمليات</h2><div class="muted">تغييرات المنتجات والكميات والطلبات والمبيعات المسجلة في هذا المتصفح.</div></div><button class="btn secondary" onclick="exportData()">تصدير نسخة JSON</button></div><section class="panel">${db.activity.length?`<div class="table-wrap"><table><thead><tr><th>التاريخ والوقت</th><th>العملية</th></tr></thead><tbody>${db.activity.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.msg)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد عمليات مسجلة حتى الآن.</div>'}</section><section class="panel"><h3>إدارة بيانات النموذج</h3><p class="muted">يمكنك تنزيل نسخة احتياطية من البيانات أو إعادة النموذج إلى البيانات التجريبية الأصلية.</p><button class="btn danger" onclick="resetDemo()">إعادة البيانات التجريبية</button></section>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='agrimed-shop-backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز نسخة البيانات')}
function resetDemo(){if(confirm('هل تريد إعادة بيانات النموذج التجريبية؟ سيتم حذف التعديلات الحالية من هذا المتصفح.')){db=JSON.parse(JSON.stringify(seed));save();render();toast('تمت إعادة البيانات التجريبية')}}
render();
</script></body></html>
